<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для тебя ♡</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #replayButton {
      position: fixed;
      z-index: 99999;
      left: 50%;
      bottom: 35px;
      transform: translateX(-50%);
      border: none;
      border-radius: 100px;
      padding: 14px 22px;
      background: rgba(0,0,0,0.75);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      display: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body>

<button id="replayButton">Проиграть ещё раз ♡</button>

<a-scene
  mindar-image="
    imageTargetSrc: ./targets.mind;
    filterMinCF: 0.001;
    filterBeta: 0.001;
    warmupTolerance: 5;
    missTolerance: 10;
  "
  embedded
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>
  <a-assets>
    <video
      id="video"
      src="./video.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      muted
    ></video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <a-video
      src="#video"
      width="1"
      height="1,3854"
      position="0 0 0.01">
    </a-video>

  </a-entity>
</a-scene>

<script>
  const target = document.querySelector("#target");
  const video = document.querySelector("#video");
  const replayButton = document.querySelector("#replayButton");

  let hasPlayed = false;

  target.addEventListener("targetFound", async () => {
    // Первый показ фотографии — запускаем ролик один раз.
    if (!hasPlayed) {
      hasPlayed = true;
      video.currentTime = 0;
      replayButton.style.display = "none";

      try {
        await video.play();
      } catch (error) {
        console.log(error);
      }
    } else if (!video.ended && video.paused) {
      // Если трекинг кратко потерял фотографию — продолжаем,
      // а не начинаем видео заново.
      try {
        await video.play();
      } catch (error) {
        console.log(error);
      }
    }
  });

  target.addEventListener("targetLost", () => {
    // Пауза помогает не проигрывать ролик, пока фото не в кадре.
    if (!video.paused && !video.ended) {
      video.pause();
    }
  });

  video.addEventListener("ended", () => {
    replayButton.style.display = "block";
  });

  replayButton.addEventListener("click", async () => {
    replayButton.style.display = "none";
    video.currentTime = 0;

    try {
      await video.play();
    } catch (error) {
      console.log(error);
      replayButton.style.display = "block";
    }
  });
</script>

</body>
</html>
