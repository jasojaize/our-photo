<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Для тебя ♡</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background: #fffaf8;
      text-align: center;
      padding: 30px;
      box-sizing: border-box;
    }

    #start h1 {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 600;
    }

    #start p {
      margin: 0 0 25px;
      font-size: 16px;
      line-height: 1.5;
      opacity: .65;
    }

    #startButton {
      border: 0;
      border-radius: 100px;
      padding: 16px 28px;

      background: #111;
      color: white;

      font-size: 16px;
    }

    #status {
      position: fixed;
      z-index: 99998;

      left: 50%;
      top: 25px;
      transform: translateX(-50%);

      background: rgba(0,0,0,.7);
      color: white;

      padding: 10px 16px;
      border-radius: 20px;

      font-size: 14px;
      white-space: nowrap;

      display: none;
    }
  </style>
</head>


<body>

<div id="start">

  <h1>Для тебя ♡</h1>

  <p>
    Здесь спрятано кое-что ещё.<br>
    Нажми кнопку и разреши доступ к камере.
  </p>

  <button id="startButton">
    Оживить фотографию
  </button>

</div>


<div id="status">
  Запускаю камеру…
</div>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    autoStart: false;
    uiLoading: yes;
    uiScanning: yes;
    uiError: yes;
  "

  embedded

  color-space="sRGB"

  renderer="
    colorManagement: true;
    physicallyCorrectLights: true;
    antialias: true;
  "

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false"

>


<a-assets timeout="15000">

  <video
    id="arVideo"
    src="./video.mp4"
    preload="auto"
    playsinline
    webkit-playsinline
    muted
  ></video>

</a-assets>


<a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>


<a-entity
  id="target"
  mindar-image-target="targetIndex: 0">

  <a-video
    src="#arVideo"
    width="1"
    height="1.7778"
    position="0 0 0.01">
  </a-video>

</a-entity>


</a-scene>


<script>

const scene = document.querySelector("a-scene");
const target = document.querySelector("#target");
const video = document.querySelector("#arVideo");

const start = document.querySelector("#start");
const button = document.querySelector("#startButton");
const status = document.querySelector("#status");


button.addEventListener("click", async () => {

  button.disabled = true;
  button.textContent = "Запускаю…";

  status.style.display = "block";
  status.textContent = "Запускаю камеру…";

  try {

    /* Разблокируем video.play() на iPhone */
    video.muted = true;

    try {
      await video.play();
      video.pause();
      video.currentTime = 0;
    } catch(e) {
      console.log("Video unlock:", e);
    }


    const arSystem =
      scene.systems["mindar-image-system"];

    if (!arSystem) {
      throw new Error("MindAR ещё не загрузился");
    }

    await arSystem.start();

  }

  catch(error) {

    console.error(error);

    status.textContent =
      "Ошибка запуска камеры";

    button.disabled = false;
    button.textContent =
      "Попробовать ещё раз";
  }

});


scene.addEventListener("arReady", () => {

  start.style.display = "none";

  status.style.display = "block";
  status.textContent =
    "Наведи камеру на фотографию ♡";

});


scene.addEventListener("arError", () => {

  status.style.display = "block";
  status.textContent =
    "Не удалось запустить камеру";

  start.style.display = "flex";

  button.disabled = false;
  button.textContent =
    "Попробовать ещё раз";

});


target.addEventListener("targetFound", async () => {

  status.style.display = "none";

  video.currentTime = 0;

  try {
    await video.play();
  }
  catch(error) {
    console.log("Video play error:", error);
  }

});


target.addEventListener("targetLost", () => {

  video.pause();
  video.currentTime = 0;

  status.style.display = "block";
  status.textContent =
    "Наведи камеру на фотографию ♡";

});

</script>

</body>
</html>
